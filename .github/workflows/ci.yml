name: Run Script to Verify 301 Redirects

on:
  workflow_dispatch:
    inputs:
      chunk:
        description: "Run specific chunk only (optional)"
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "00 01 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

# ======================================================
# 1️⃣ PREPARE JOB – CALCULATE TOTAL CHUNKS
# ======================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_manual_chunk: ${{ steps.check-manual.outputs.has_manual_chunk }}
      manual_chunk: ${{ steps.check-manual.outputs.manual_chunk }}

    steps:
      - uses: actions/checkout@v4

      - name: Check manual chunk input
        id: check-manual
        run: |
          if [ -n "${{ github.event.inputs.chunk }}" ]; then
            echo "has_manual_chunk=true" >> $GITHUB_OUTPUT
            echo "manual_chunk=[${{ github.event.inputs.chunk }}]" >> $GITHUB_OUTPUT
          else
            echo "has_manual_chunk=false" >> $GITHUB_OUTPUT
          fi

      - name: Calculate chunks from CSV
        id: set-matrix
        if: steps.check-manual.outputs.has_manual_chunk == 'false'
        run: |
          total=$(($(wc -l < redirect_mapping.csv) - 1))
          batch_size=3825
          chunks=$(( (total + batch_size - 1) / batch_size ))

          echo "Total URLs: $total"
          echo "Batch size: $batch_size"
          echo "Total chunks: $chunks"

          matrix=$(seq -s, 1 $chunks | sed 's/,/, /g')
          echo "matrix=[${matrix}]" >> $GITHUB_OUTPUT

# ======================================================
# 2️⃣ TEST JOB – RUN PYTEST PER CHUNK
# ======================================================
  test:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(
          needs.prepare.outputs.has_manual_chunk == 'true' &&
          needs.prepare.outputs.manual_chunk ||
          needs.prepare.outputs.matrix
        ) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-pytest

      - name: Run pytest (chunk ${{ matrix.chunk }})
        continue-on-error: true
        run: |
          pytest tests/test_redirect.py \
            --chunk=${{ matrix.chunk }} \
            --alluredir=allure-results \
            -q

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-chunk-${{ matrix.chunk }}
          path: allure-results

# ======================================================
# 3️⃣ GENERATE ALLURE REPORT
# ======================================================
  generate-report:
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gh unzip

      - name: Download and merge Allure results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p allure-results
          artifacts=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts \
            --jq '.artifacts[].name' | grep '^allure-results-')

          for name in $artifacts; do
            url=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts \
              --jq ".artifacts[] | select(.name==\"$name\") | .archive_download_url")

            curl -sL -H "Authorization: token $GH_TOKEN" "$url" -o "$name.zip"
            unzip -q "$name.zip" -d tmp
            cp -r tmp/* allure-results/
            rm -rf tmp "$name.zip"
          done

      - name: Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -xzf allure-2.27.0.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Generate Allure report
        run: allure generate allure-results -o allure-report --clean

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report

# ======================================================
# 4️⃣ DEPLOY REPORT TO GITHUB PAGES
# ======================================================
  deploy-report:
    runs-on: ubuntu-latest
    needs: generate-report
    if: always()
    environment:
      name: github-pages

    steps:
      - name: Deploy report to GitHub Pages
        uses: actions/deploy-pages@v4
